# Платформа за nginx: он держит соединения, отдаёт статику и знает про
# длинные запросы Odoo (выгрузки, отчёты) — иначе они рвутся на минуте.
upstream coop_odoo { server 127.0.0.1:8069; }
# В многопоточном режиме (workers = 0) отдельного процесса для долгих
# соединений нет — переписка обслуживается тем же портом.
upstream coop_odoo_chat { server 127.0.0.1:8069; }

server {
    listen 80;
    # Домен daocoop.tech — только по https (решение 433). Сертификат
    # Let's Encrypt выпущен certbot'ом на сервере 28.09.2026 и продлевается
    # его таймером; после продления nginx перечитывает его хуком
    # /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh.
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/daocoop.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daocoop.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:coop_ssl:10m;
    ssl_session_timeout 1d;

    # Один адрес: http://daocoop.tech, http://www… и https://www… ведут на
    # https://daocoop.tech. Обращения по голому IP остаются на http —
    # по нему стенд читает журнал узла, а сертификата на IP нет.
    # Проверка домена при продлении проходит и через переадресацию:
    # Let's Encrypt идёт за ней на https, где тот же путь acme-challenge.
    set $coop_to_https "";
    if ($host ~* ^(www\.)?daocoop\.tech$) { set $coop_to_https "d"; }
    if ($scheme = http) { set $coop_to_https "${coop_to_https}h"; }
    if ($coop_to_https = "dh") { return 301 https://daocoop.tech$request_uri; }
    if ($host ~* ^www\.daocoop\.tech$) { return 301 https://daocoop.tech$request_uri; }

    client_max_body_size 64M;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Проверка домена для сертификата Let's Encrypt (daocoop.tech,
    # решение 433): certbot кладёт сюда файл, центр сертификации читает
    # его по http. Только этот путь — остальное под /.well-known/ (адрес
    # узла федерации did.json) по-прежнему отдаёт Odoo.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    # Живые обновления переписки идут отдельным долгим соединением.
    location /websocket {
        proxy_pass http://coop_odoo_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Пока служба перезапускается после обновления, nginx отдаёт свою
    # страницу вместо голого «502 Bad Gateway». Обновление идёт раз
    # в минуту, и участник не должен видеть ошибку сервера каждый раз,
    # когда мы что-то выкатили: он видит «платформа обновляется»
    # и через три секунды оказывается там, куда шёл.
    error_page 502 503 504 = @maintenance;

    location @maintenance {
        root /var/www/coop;
        try_files /maintenance.html =502;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://coop_odoo;
        proxy_redirect off;
    }

    # Собранные стили и скрипты не меняются в пределах адреса: адрес
    # содержит отпечаток сборки, и Odoo помечает их `public, immutable`.
    #
    # `Set-Cookie` здесь снимается намеренно. Odoo вешает session_id на
    # каждый ответ, включая эти файлы, а nginx не кэширует ничего, к чему
    # прицеплена кука: из-за этого прежний `proxy_cache_valid` не
    # кэшировал ни одного пакета — проверено заголовком X-Coop-Cache,
    # который отвечал MISS и на втором запросе подряд. В собранных
    # пакетах нет ничего пользовательского, а сессию браузер получает с
    # любым другим запросом.
    location ~* /web/assets/ {
        proxy_pass http://coop_odoo;
        proxy_cache coop_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Coop-Cache $upstream_cache_status;
    }

    # Картинки каталогов (`/web/image/`) через кэш не идут, и это не
    # недосмотр. Odoo отдаёт их с пометкой `private`, а без сессии
    # возвращает заглушку вместо снимка: снимок зависит от того, кто
    # спрашивает. Общий кэш по адресу раздавал бы один ответ всем и
    # обходил проверку прав. Браузеру они кэшируются на год — в адресе
    # стоит отметка времени, — поэтому платит только первый заход.

    # Сжатие. Уровень задан явно: у nginx по умолчанию первый, самый
    # слабый, и собранный пакет ужимался с 7,4 МБ только до 2,0 МБ.
    # Шестой даёт около 1,6 МБ — на четверть меньше по проводу.
    #
    # Платить за это нечем: ответы с ассетами лежат в кэше nginx
    # (`proxy_cache coop_cache` выше), поэтому сжатие считается один раз
    # на версию пакета, а не на каждый заход. Для всего остального —
    # страниц и ответов API — шестой уровень стоит доли миллисекунды на
    # килобайтах, а не на мегабайтах.
    #
    # `text/javascript` добавлен рядом с `application/javascript`: тип
    # отдаёт движок, и он менялся между версиями. Лишняя строка ничего
    # не стоит, а несжатый мегабайтный пакет стоит секунд.
    #
    # `gzip_vary` обязателен, раз ответы кэшируются: без него кэш может
    # отдать сжатое тело клиенту, который сжатия не просил.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript text/javascript
               application/json image/svg+xml application/xml text/xml;
}
