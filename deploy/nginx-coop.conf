# Платформа за nginx: он держит соединения, отдаёт статику и знает про
# длинные запросы Odoo (выгрузки, отчёты) — иначе они рвутся на минуте.
upstream coop_odoo { server 127.0.0.1:8069; }
# В многопоточном режиме (workers = 0) отдельного процесса для долгих
# соединений нет — переписка обслуживается тем же портом.
upstream coop_odoo_chat { server 127.0.0.1:8069; }

server {
    listen 80;
    server_name _;

    client_max_body_size 64M;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Живые обновления переписки идут отдельным долгим соединением.
    location /websocket {
        proxy_pass http://coop_odoo_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Пока служба перезапускается после обновления, nginx отдаёт свою
    # страницу вместо голого «502 Bad Gateway». Обновление идёт раз
    # в минуту, и участник не должен видеть ошибку сервера каждый раз,
    # когда мы что-то выкатили: он видит «платформа обновляется»
    # и через три секунды оказывается там, куда шёл.
    error_page 502 503 504 = @maintenance;

    location @maintenance {
        root /var/www/coop;
        try_files /maintenance.html =502;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://coop_odoo;
        proxy_redirect off;
    }

    # Собранные стили и скрипты не меняются в пределах адреса: адрес
    # содержит отпечаток сборки.
    location ~* /web/assets/ {
        proxy_pass http://coop_odoo;
        proxy_cache coop_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Coop-Cache $upstream_cache_status;
    }

    # Картинки каталогов. Страница каталога просит по одной на карточку,
    # и на экране людей их восемьдесят: сами по себе они быстрые, но на
    # одном ядре встают в очередь и дают те самые секунды ожидания.
    #
    # Адрес каждой картинки содержит отметку времени (`unique=`), то есть
    # при изменении снимка меняется и адрес — старый ответ из кэша уже
    # никому не достанется.
    #
    # Заголовки источника не игнорируются намеренно: Odoo сам помечает
    # ответ `private`, если картинку нельзя показывать кому попало, и
    # такие ответы nginx не кэширует. Прав доступа кэш не обходит.
    location ~* /web/image/ {
        proxy_pass http://coop_odoo;
        proxy_cache coop_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        add_header X-Coop-Cache $upstream_cache_status;
    }

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
}
