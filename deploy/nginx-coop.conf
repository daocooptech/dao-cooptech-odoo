# Платформа за nginx: он держит соединения, отдаёт статику и знает про
# длинные запросы Odoo (выгрузки, отчёты) — иначе они рвутся на минуте.
upstream coop_odoo { server 127.0.0.1:8069; }
# В многопоточном режиме (workers = 0) отдельного процесса для долгих
# соединений нет — переписка обслуживается тем же портом.
upstream coop_odoo_chat { server 127.0.0.1:8069; }

server {
    listen 80;
    server_name _;

    client_max_body_size 64M;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Живые обновления переписки идут отдельным долгим соединением.
    location /websocket {
        proxy_pass http://coop_odoo_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://coop_odoo;
        proxy_redirect off;
    }

    # Собранные стили и скрипты не меняются в пределах адреса: адрес
    # содержит отпечаток сборки.
    location ~* /web/assets/ {
        proxy_pass http://coop_odoo;
        proxy_cache_valid 200 60m;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
}
