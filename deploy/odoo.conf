[options]
; Настройки боевого стенда ДАО КООПТЕХ.
; Пути соответствуют install.sh: всё живёт в /opt/coop.

addons_path = /opt/coop/coop-addons,/opt/coop/coop-addons/forks,/opt/coop/rudoo-addons,/opt/coop/odoo/addons
data_dir = /var/lib/coop
logfile = /var/log/coop/odoo.log
log_level = info

db_host = False
db_port = False
db_user = odoo
db_password = odoo
; Одна база и без списка баз: платформа — не хостинг Odoo, выбирать
; участнику нечего, а открытый список — лишняя дверь.
db_name = koopeh
dbfilter = ^koopeh$
list_db = False

; Наружу смотрит nginx, Odoo слушает только петлю.
http_interface = 127.0.0.1
http_port = 8069
proxy_mode = True

; Два рабочих процесса на два ядра плюс планировщик. При workers = 0
; длинный запрос одного участника останавливает всех остальных.
workers = 2
max_cron_threads = 1
limit_time_cpu = 120
limit_time_real = 240
limit_memory_soft = 1200000000
limit_memory_hard = 1500000000
