[options]
; Настройки боевого стенда ДАО КООПТЕХ.
; Пути соответствуют install.sh: всё живёт в /opt/coop.

addons_path = /opt/coop/coop-addons,/opt/coop/coop-addons/forks,/opt/coop/odoo/addons
data_dir = /var/lib/coop
logfile = /var/log/coop/odoo.log
log_level = info

db_host = False
db_port = False
db_user = odoo
db_password = odoo
; Одна база и без списка баз: платформа — не хостинг Odoo, выбирать
; участнику нечего, а открытый список — лишняя дверь.
db_name = cooptech
dbfilter = ^cooptech$
list_db = False

; Наружу смотрит nginx, Odoo слушает только петлю.
http_interface = 127.0.0.1
http_port = 8069
proxy_mode = True

; Одно ядро (до 13.11.2026 — и гигабайт памяти) — отдельные рабочие процессы тут во вред:
; каждый занимает свою память, а второго ядра, чтобы они работали
; одновременно, всё равно нет. Поэтому многопоточный режим (workers = 0)
; и жёсткие пределы памяти: при 958 МБ на машине процесс, разросшийся до
; гигабайта, утянет за собой и базу.
;
; Плата за это известна: длинный запрос одного участника задерживает
; остальных. На стенде для показа это приемлемо; когда появятся живые
; участники, машину надо будет расширить и вернуть workers = 2.
workers = 0
max_cron_threads = 1
limit_time_cpu = 300
limit_time_real = 600
; Пределы — по виртуальной памяти процесса, не по занятой: Odoo мерит
; адресное пространство. 13.11.2026 (задача 442): загруженный сервер с
; 203 модулями сам по себе занимает ~710 МБ адресов при ~200 МБ реальных,
; и старый мягкий предел 620 МБ перезапускал его каждую минуту с 11.11,
; обрывая кроны; жёсткий 780 МБ ронял выкатку `MemoryError` (12.11).
; Машина с тех пор — 3,9 ГБ памяти и 3 ГБ подкачки.
limit_memory_soft = 1200000000
limit_memory_hard = 1600000000

; Узел сети (решения 431, 432): имя в адресной строке и адрес для did:web.
; Адрес — навсегда: сменить его значит переехать всей сетью.
coop_node_path = nn1
; С 28.09.2026 — домен daocoop.tech (решение 433): узел на IP прожил день
; с одним событием и переехал, пока это ничего не стоило.
coop_node_host = daocoop.tech
