# Кэш nginx для собранных пакетов и картинок каталогов.
#
# Зона объявляется в контексте http, поэтому лежит отдельным файлом в
# conf.d, а не в блоке сайта: в блоке server директива proxy_cache_path
# недопустима, и без неё `proxy_cache_valid` в конфиге сайта ничего не
# кэшировал — он задаёт срок для зоны, которой не было.
#
# Зачем: страница каталога запрашивает по одной картинке на карточку —
# восемьдесят запросов на экран людей. Каждый из них сам по себе быстрый
# (десять миллисекунд), но машина одноядерная и Odoo работает в
# многопоточном режиме, поэтому они выстраиваются в очередь. Отданные
# из кэша nginx, они до Python вообще не доходят.
#
# Размер подобран под диск машины: 300 МБ хватает на все аватары и
# сборки, а места на машине заметно больше.
proxy_cache_path /var/cache/nginx/coop levels=1:2 keys_zone=coop_cache:10m
                 max_size=300m inactive=7d use_temp_path=off;
