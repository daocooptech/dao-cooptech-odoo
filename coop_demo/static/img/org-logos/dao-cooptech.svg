<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <rect width="640" height="640" fill="#ffffff"/>
  <!-- буквы C-O / O-P (не просто кольца!), внутри каждой — буквы T-E-C-H -->
  <!-- C: кольцо с разрывом справа (раскрыто навстречу O) -->
  <path d="M 267.82 226.49 A 95 95 0 1 1 267.82 117.51" fill="none" stroke="#000000" stroke-width="44" stroke-linecap="butt"/>
  <!-- O (верх-право) -->
  <circle cx="450" cy="172" r="95" fill="none" stroke="#000000" stroke-width="44"/>
  <!-- O (низ-лево) -->
  <circle cx="190" cy="432" r="95" fill="none" stroke="#000000" stroke-width="44"/>
  <!-- P (низ-право): кольцо + ножка вниз -->
  <circle cx="450" cy="432" r="95" fill="none" stroke="#000000" stroke-width="44"/>
  <rect x="428" y="549" width="44" height="85" fill="#000000"/>
  <!-- перемычка C-O в верхнем ряду -->
  <rect x="307" y="150" width="26" height="44" fill="#000000"/>
  <!-- буквы TECH внутри C-O-O-P -->
  <g font-family="Arial, 'Helvetica Neue', sans-serif" font-weight="700" fill="#000000" text-anchor="middle">
    <text x="190" y="208" font-size="104">T</text>
    <text x="450" y="208" font-size="104">E</text>
    <text x="190" y="468" font-size="104">C</text>
    <text x="450" y="468" font-size="104">H</text>
  </g>
</svg>
